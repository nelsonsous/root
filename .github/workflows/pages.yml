name: Publicar apps no GitHub Pages

# Mantém a branch gh-pages atualizada: Piano Mágico na raiz e
# Gestor de Tarefas em /tarefas/.
# Só precisa de "contents: write" (não exige permissões de administrador).

on:
  push:
    branches:
      - claude/apple-watch-padel-app-jcgJO
      - claude/nova-task-management-app-s8zu0l
    paths:
      - "simple-piano/**"
      - "gestor-tarefas/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site (piano na raiz, tarefas em /tarefas)
        run: |
          mkdir -p dist/tarefas
          [ -d simple-piano ] && cp -r simple-piano/. dist/
          [ -d gestor-tarefas ] && cp -r gestor-tarefas/. dist/tarefas/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: "deploy: Piano Mágico + Gestor de Tarefas"
