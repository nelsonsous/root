name: Publicar Estrelas da Ginástica no GitHub Pages

# Publica gymnastics-coach/ em gh-pages/ginastica/ sem apagar o piano
# (raiz do site) nem a Treinadora de Voleibol (/voleibol).

on:
  push:
    branches:
      - claude/gymnastics-coaching-game-qv2sbl
      - claude/apple-watch-padel-app-jcgJO
    paths:
      - "gymnastics-coach/**"
      - ".github/workflows/pages-ginastica.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gymnastics-coach
          destination_dir: ginastica
          keep_files: true
          commit_message: "deploy: Estrelas da Ginástica"
