name: PadelWatch
options:
  bundleIdPrefix: com.padel
  deploymentTarget:
    watchOS: "10.0"
  minimumXcodeVersion: "15.0"
  xcodeVersion: "15.0"

settings:
  SWIFT_VERSION: "5.9"
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"

targets:
  PadelWatch Watch App:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: "PadelWatch Watch App"
        excludes:
          - "**/.DS_Store"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.padel.PadelWatch.watchkitapp
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      INFOPLIST_KEY_CFBundleDisplayName: PadelWatch
      INFOPLIST_KEY_WKApplication: true
      INFOPLIST_KEY_WKCompanionAppBundleIdentifier: ""
      GENERATE_INFOPLIST_FILE: YES
